[package]
name = "exhentai-api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.3.1"
env_logger = "0.10.0"
diesel = { version = "2.1.0", features = ["sqlite", "postgres", "postgres_backend"] }
dotenvy = "0.15"
serde = {version = "1.0.164", features = ["derive"]}
serde_json = "1.0.97"
reqwest = {version = "0.11.18", features = ["stream"]}
tokio = {version = "1.28.2", features = ["full"]}
anyhow = "1.0.71"
regex = "1.8.4"
chrono = "0.4.26"
tokio-stream = "0.1.14"
bytes = "1.4.0"
futures-util = "0.3.28"
log = "0.4.0"
local-ip-address = "0.5.3"